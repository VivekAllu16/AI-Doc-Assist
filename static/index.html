<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Assistant</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-animation"></div>
    
    <!-- Auth Screen -->
    <div id="authScreen" class="auth-container glass-panel">
        <div class="logo-area" style="justify-content: center; margin-bottom: 24px;">
            <i class="fa-solid fa-brain logo-icon"></i>
            <h1>DocAssist AI</h1>
        </div>
        
        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin">Login</button>
            <button class="auth-tab" id="tabRegister">Register</button>
        </div>
        
        <form id="authForm">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div id="authError" class="auth-error hidden"></div>
            <button type="submit" id="authBtn" class="primary-btn">Sign In</button>
        </form>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="app-container hidden">
        <!-- Sidebar / Upload Area -->
        <aside class="sidebar glass-panel">
            <div class="logo-area">
                <i class="fa-solid fa-brain logo-icon"></i>
                <h1>DocAssist AI</h1>
            </div>
            
            <div class="user-info">
                <i class="fa-solid fa-circle-user"></i>
                <span id="displayUsername">User</span>
                <button id="logoutBtn" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
            
            <div class="upload-section">
                <h2>Knowledge Base</h2>
                <p class="subtitle">Upload multiple PDF documents to build your context.</p>
                
                <div class="upload-box" id="uploadBox">
                    <input type="file" id="fileInput" accept=".pdf" multiple hidden>
                    <i class="fa-solid fa-file-arrow-up upload-icon"></i>
                    <p>Click or drag PDFs here</p>
                </div>
                
                <div id="uploadStatus" class="status-message hidden">
                    <div class="spinner"></div>
                    <span>Processing documents...</span>
                </div>
                
                <div id="fileInfo" class="file-info hidden">
                    <i class="fa-regular fa-file-pdf"></i>
                    <span id="fileName">0 documents loaded</span>
                    <i class="fa-solid fa-check text-success"></i>
                </div>

                <div class="doc-list-section">
                    <h2>Uploaded Documents</h2>
                    <p class="subtitle">Manage your PDF knowledge base.</p>
                    <div id="docList" class="doc-list empty">No documents uploaded yet.</div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area glass-panel">
            <div class="chat-header">
                <div>
                    <h2>Chat Session</h2>
                    <button id="newChatBtn" class="secondary-btn">New Chat</button>
                </div>
                <div class="status-indicator">
                    <span class="dot offline" id="systemStatusDot"></span>
                    <span id="systemStatusText">Awaiting Documents</span>
                </div>
            </div>
            
            <div class="chat-history" id="chatHistory">
                <!-- History will be loaded dynamically -->
            </div>
            
            <div class="chat-input-area">
                <form id="chatForm">
                    <input type="text" id="questionInput" placeholder="Ask a question about your documents..." autocomplete="off">
                    <button type="submit" id="sendBtn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
